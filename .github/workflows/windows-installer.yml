name: Build MynAssistant Windows Installer

concurrency:
  # Keep push-preview packaging separate from pull-request validation so that
  # the direct-download prerelease fallback is not cancelled by the parallel PR run.
  group: mynai-windows-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "fix/stage1-account-bound-pairing"]
    paths:
      - "src/**"
      - "tools/MynAssistantDesktopBridge/**"
      - "tools/DesktopPairingContractSmoke/**"
      - "installer/**"
      - "assets/branding/**"
      - ".github/scripts/**"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    branches: ["main", "fix/windows-pcfiles-list-files", "fix/stage1-account-bound-pairing"]
    paths:
      - "src/**"
      - "tools/MynAssistantDesktopBridge/**"
      - "tools/DesktopPairingContractSmoke/**"
      - "installer/**"
      - "assets/branding/**"
      - ".github/scripts/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify preinstalled .NET 10 SDK
        shell: pwsh
        run: |
          $sdks = dotnet --list-sdks
          $net10 = $sdks | Where-Object { $_ -match '^10\.0\.\d+' }
          if (-not $net10) {
            throw "The hosted Windows runner does not have a .NET 10 SDK. Avoid a network install because dotnetorigin returned HTTP 409."
          }
          dotnet --info

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install desktop bridge dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --timeout 60 --retries 2 -r tools/MynAssistantDesktopBridge/requirements.txt Pillow

      - name: Test desktop bridge command handling
        run: python -m unittest discover -s tools/MynAssistantDesktopBridge/tests -v

      - name: Verify bridge supports atomic claims and keyboard actions
        shell: pwsh
        run: |
          $bridgePath = "tools/MynAssistantDesktopBridge/agent.py"
          foreach ($pattern in @("claim_pending_command", "claimToken", '"type_text"', '"key_backspace"', '"key_enter"', "configure_packaged_logging", '"auth_required"', "FirebaseSessionExpiredError")) {
            if (-not (Select-String -Path $bridgePath -Pattern $pattern -Quiet)) {
              throw "Windows bridge is missing required feature: $pattern"
            }
          }

      - name: Generate current MynAssistant branding
        shell: pwsh
        run: |
          python .github/scripts/generate_branding.py

      - name: Build desktop bridge executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/bridge-dist, build/pyinstaller-work, build/pyinstaller-spec | Out-Null
          pyinstaller --noconfirm --clean --onefile --noconsole --name MynAssistantDesktopBridge --distpath build/bridge-dist --workpath build/pyinstaller-work --specpath build/pyinstaller-spec --hidden-import win32crypt tools/MynAssistantDesktopBridge/agent.py
          if (-not (Test-Path "build/bridge-dist/MynAssistantDesktopBridge.exe")) {
            throw "Desktop Bridge EXE was not created."
          }

      - name: Verify bounded UI and installer changes
        shell: pwsh
        run: |
          $settingsPath = "src/MynAI.Windows/SettingsWindow.xaml"
          $settingsText = Get-Content -LiteralPath $settingsPath -Raw -Encoding UTF8
          $accountStart = $settingsText.IndexOf("<!-- HESAP -->")
          $accountEnd = $settingsText.IndexOf("<!-- GİZLİLİK -->")
          if ($accountStart -lt 0 -or $accountEnd -le $accountStart) { throw "Could not identify the Account settings section." }
          $account = $settingsText.Substring($accountStart, $accountEnd - $accountStart)
          foreach ($forbidden in @("Telefon-PC hesabı", "FirebaseEmailTextBox", "FirebasePasswordBox", "FirebaseSessionStatusText", "FirebaseSignInButton", "FirebaseSignOutButton")) {
            if ($account.Contains($forbidden)) { throw "Firebase credential UI remains in Account settings: $forbidden" }
          }
          foreach ($required in @("AccountDesktopBridgeStatusText", "AccountDesktopBridgeStatusDot", "AccountDesktopBridgeMessageText", "AccountBridgeRefreshButton", "GooglePhoto", "GoogleConnectButton", "GoogleContactsConnectButton", "DesktopLoginStatusText", "GoogleContactsCheckBox")) {
            if (-not $account.Contains($required)) { throw "Account section is missing preserved UI: $required" }
          }
          if (-not $account.Contains('Content="Giriş yap"') -or -not $account.Contains('Click="LoginDesktopAccount_Click"')) { throw "Account sign-in must start the Firebase phone-approved login flow." }
          if (-not $account.Contains('Content="Kişileri bağla"') -or -not $account.Contains('Click="GoogleConnectButton_Click"')) { throw "Optional Google Contacts connection must remain available separately from app login." }

          [xml]$settingsXml = $settingsText
          $xamlNames = @($settingsXml.SelectNodes('//@*[local-name()="Name" and namespace-uri()="http://schemas.microsoft.com/winfx/2006/xaml"]') | ForEach-Object { $_.Value })
          $duplicates = @($xamlNames | Group-Object | Where-Object { $_.Count -gt 1 })
          if ($duplicates.Count -gt 0) { throw "Duplicate x:Name values in SettingsWindow.xaml: $($duplicates.Name -join ', ')" }

          $mainText = Get-Content -LiteralPath "src/MynAI.Windows/MainWindow.xaml" -Raw -Encoding UTF8
          if (-not $mainText.Contains('Text="= Beklemede"')) { throw "Waiting badge must read '= Beklemede'." }
          if (-not ($mainText -match 'x:Name="MainHeaderGrid"(?s).*?Margin="0,0,0,5"')) { throw "Main header must have a 5 DIP bottom margin." }
          if (-not $mainText.Contains('Text="Bağlanıyor •"')) { throw "The initial Agent status label must stay visible and concise." }
          if (-not $mainText.Contains('Text="Planlanan Görevler"')) { throw "Planned tasks heading must be localized to 'Planlanan Görevler'." }
          if (-not ($mainText -match '(?s)<!-- PLANLANAN GÖREVLER -->.*?<Border Grid.Row="1".*?CornerRadius="17".*?MinHeight="116".*?VerticalAlignment="Stretch"')) { throw "Planned tasks card must have rounded corners and stretch to the bottom of its panel." }
          if ($mainText -match '(?s)<ScrollViewer Grid.Row="1"\s+(?:Height|MaxHeight)="72"') { throw "Planned tasks scroll area must stretch instead of forcing a fixed height." }

          $installerText = Get-Content -LiteralPath "installer/MynAI.iss" -Raw -Encoding UTF8
          if (-not $installerText.Contains("MynAssistant bilgisayarınızda zaten kurulu. Mevcut kurulumu güncellemek ister misiniz?")) { throw "Installer update confirmation text is missing." }
          if (-not $installerText.Contains("GetVersionNumbersString")) { throw "Installer must verify the installed EXE file version." }
          if ($installerText.Contains("DeleteDir(ExpandConstant('{app}')")) { throw "Installer must not delete the entire install directory." }
          $prepareStart = $installerText.IndexOf("function PrepareToInstall(var NeedsRestart: Boolean): String;")
          $normalizeStart = $installerText.IndexOf("function NormalizeInstallDir", $prepareStart)
          if ($prepareStart -lt 0 -or $normalizeStart -le $prepareStart) { throw "Installer must stop MynAssistant processes in PrepareToInstall before CloseApplications checks locked files." }
          $prepareCode = $installerText.Substring($prepareStart, $normalizeStart - $prepareStart)
          foreach ($processStop in @("StopProcessByName('{#MyAppExeName}')", "StopProcessByName('MynAssistantDesktopBridge.exe')", "StopProcessByName('{#MyAgentExeName}')", "StopProcessByName('MynAI.Agent.exe')")) {
            if (-not $prepareCode.Contains($processStop)) { throw "Installer pre-install process shutdown is missing: $processStop" }
          }

          # Stage 5 regression checks: permissions and one-shot scheduled actions.
          $schedulerText = Get-Content -LiteralPath "src/MynAI.Agent/Scheduler/MynScheduler.cs" -Raw -Encoding UTF8
          $pipeText = Get-Content -LiteralPath "src/MynAI.Agent/IPC/AgentPipeServer.cs" -Raw -Encoding UTF8
          $mainCode = Get-Content -LiteralPath "src/MynAI.Windows/MainWindow.xaml.cs" -Raw -Encoding UTF8
          $settingsModelText = Get-Content -LiteralPath "src/MynAI.Windows/MynAISettings.cs" -Raw -Encoding UTF8
          $settingsCodeText = Get-Content -LiteralPath "src/MynAI.Windows/SettingsWindow.xaml.cs" -Raw -Encoding UTF8
          $settingsText = Get-Content -LiteralPath "src/MynAI.Windows/SettingsWindow.xaml" -Raw -Encoding UTF8
          $bridgeText = Get-Content -LiteralPath "tools/MynAssistantDesktopBridge/agent.py" -Raw -Encoding UTF8
          $bridgeTests = Get-Content -LiteralPath "tools/MynAssistantDesktopBridge/tests/test_agent_commands.py" -Raw -Encoding UTF8

          if (-not $schedulerText.Contains("marked failed to prevent duplicate execution") -or
              -not $schedulerText.Contains("ScheduledTaskStatus.Failed")) {
            throw "Interrupted scheduled actions must be marked failed instead of replayed after Agent restart."
          }
          if ($schedulerText -match 'if\s*\(\s*task\.Status\s*==\s*ScheduledTaskStatus\.Executing\s*\)\s*\{\s*task\.Status\s*=\s*ScheduledTaskStatus\.Pending') {
            throw "Interrupted scheduled actions must not be returned to Pending."
          }
          if (-not $pipeText.Contains("PipeOptions.Asynchronous | PipeOptions.CurrentUserOnly")) {
            throw "Agent IPC must be restricted to the current Windows user."
          }
          if (-not $mainCode.Contains("MessageBoxButton.YesNo") -or
              -not $mainCode.Contains("ScheduledAction.Shutdown or ScheduledAction.Restart")) {
            throw "Shutdown and restart requests must require explicit user confirmation."
          }
          if (-not $settingsModelText.Contains("RemoteControlEnabled") -or
              -not $settingsModelText.Contains("RemoteControlEnabledAt") -or
              -not $settingsText.Contains('x:Name="RemoteControlCheckBox"') -or
              -not $settingsCodeText.Contains("updatedSettings.RemoteControlEnabled = requestedRemoteControlEnabled;") -or
              -not $settingsCodeText.Contains("updatedSettings.RemoteControlEnabledAt = DateTimeOffset.UtcNow;")) {
            throw "Remote-control permission and the re-enable cutoff must be visible and persisted from Settings."
          }
          foreach ($requiredPermissionGuard in @("def remote_control_enabled()", "def remote_control_reenable_cutoff()", "command_predates_remote_control_reenable", "fail_pending_commands_when_remote_control_disabled", "RemoteControlEnabled", "RemoteControlEnabledAt", "Could not refresh pending commands")) {
            if (-not $bridgeText.Contains($requiredPermissionGuard)) { throw "Desktop Bridge remote-control guard is missing: $requiredPermissionGuard" }
          }
          foreach ($requiredPermissionTest in @("class RemoteControlPermissionTests", "test_explicitly_disabled_remote_control_is_respected", "test_malformed_settings_fail_closed", "test_queue_read_failure_does_not_raise_or_stop_permission_guard", "test_reenable_timestamp_is_loaded_from_settings", "test_commands_queued_before_reenable_are_rejected", "test_missing_command_timestamp_fails_closed_after_reenable")) {
            if (-not $bridgeTests.Contains($requiredPermissionTest)) { throw "Desktop Bridge permission regression coverage is missing: $requiredPermissionTest" }
          }


      - name: Verify WPF window icon loading remains non-fatal
        shell: pwsh
        run: |
          $windowXaml = @(
            "src/MynAI.Windows/MainWindow.xaml",
            "src/MynAI.Windows/SettingsWindow.xaml"
          )
          foreach ($path in $windowXaml) {
            if (Select-String -Path $path -Pattern 'Icon="Resources/myn.ico"' -Quiet) {
              throw "Do not load .ico via the WPF XAML ImageSource converter in $path."
            }
          }
          if (-not (Test-Path "src/MynAI.Windows/Resources/myn.jpg")) {
            throw "Fallback window image is missing."
          }
          if (-not (Select-String -Path "src/MynAI.Windows/MynAssistantBranding.cs" -Pattern 'BitmapCacheOption.OnLoad' -Quiet)) {
            throw "The in-app logo loader must decode images safely with OnLoad."
          }
          if (-not (Select-String -Path "src/MynAI.Agent/MynAI.Agent.csproj" -Pattern '<OutputType>WinExe</OutputType>' -Quiet)) {
            throw "MynAgent must not allocate a visible console window."
          }
          if (Select-String -Path "installer/MynAI.iss" -Pattern 'MynAgent arka plan hizmetini başlat|build/config/client_secret.json|Tasks: pcbridge' -Quiet) {
            throw "The installer must not expose an Agent launch option or embed a builder OAuth JSON."
          }
          if (Select-String -Path "src/MynAI.Windows/SettingsWindow.xaml" -Pattern 'OAuth JSON dosyasını seç|Google OAuth yapılandırması' -Quiet) {
            throw "Customers must not be asked to provide an OAuth JSON file."
          }
          if (Select-String -Path "tools/MynAssistantDesktopBridge/agent.py" -Pattern 'client_secret.json|InstalledAppFlow|ask_install_startup|google_oauth_credentials' -Quiet) {
            throw "The phone-PC bridge must use the stored Firebase session, not interactive OAuth JSON setup."
          }
          if (-not (Select-String -Path "src/MynAI.Windows/SettingsWindow.xaml.cs" -Pattern 'LoadWindowIconSafely' -Quiet)) {
            throw "The settings-window icon must use the safe loader."
          }

      - name: Restore and build .NET solution
        shell: pwsh
        run: |
          dotnet restore MynAI.slnx
          dotnet build MynAI.slnx --configuration Release --no-restore

      - name: Test Windows/Android pairing QR contract
        shell: pwsh
        run: dotnet run --project tools/DesktopPairingContractSmoke/DesktopPairingContractSmoke.csproj --configuration Release

      - name: Publish MynAssistant Windows application
        shell: pwsh
        run: |
          dotnet publish src/MynAI.Windows/MynAI.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false --output build/publish

          dotnet publish src/MynAI.Agent/MynAI.Agent.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -p:WindowsAppSDKSelfContained=true --output build/agent-publish

          Copy-Item "build/bridge-dist/MynAssistantDesktopBridge.exe" "build/publish/MynAssistantDesktopBridge.exe" -Force

          if (-not (Test-Path "build/publish/MynAssistant.exe")) {
            throw "MynAssistant.exe was not published."
          }
          if (-not (Test-Path "build/agent-publish/MynAgent.exe")) {
            throw "MynAgent.exe was not published; refusing to create an installer without the background Agent."
          }
          if (-not (Test-Path "build/publish/MynAssistantDesktopBridge.exe")) {
            throw "MynAssistantDesktopBridge.exe was not published."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Validate and compile Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredFiles = @(
            "installer/LICENSE-AGREEMENT.rtf",
            "src/MynAI.Windows/Resources/myn.ico",
            "src/MynAI.Windows/Resources/myn.jpg",
            "src/MynAI.Windows/Resources/myn.png",
            "src/MynAI.Windows/Resources/myn-dark.png",
            "src/MynAI.Windows/Resources/kr-kralus.png",
            "build/installer/MynAssistantWizardSmall.bmp",
            "build/publish/MynAssistant.exe",
            "build/publish/MynAssistantDesktopBridge.exe",
            "build/agent-publish/MynAgent.exe"
          )
          foreach ($path in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required installer asset is missing: $path"
            }
          }
          if (-not (Select-String -Path "src/MynAI.Windows/MynAI.Windows.csproj" -Pattern '<Version>0.1.6</Version>' -Quiet)) {
            throw "Windows app version is not 0.1.6."
          }
          if (-not (Select-String -Path "installer/MynAI.iss" -Pattern '#define MyAppVersion "0.1.6"' -Quiet)) {
            throw "Installer version does not match 0.1.6."
          }
          if (Select-String -Path "installer/MynAI.iss" -Pattern 'ArchitecturesAllowed=x64$|ArchitecturesInstallIn64BitMode=x64$' -Quiet) {
            throw "Use x64compatible architecture identifiers to avoid deprecated Inno Setup settings."
          }

          if (-not (Select-String -Path "installer/MynAI.iss" -SimpleMatch 'WizardLicense=Lisans sözleşmesi' -Quiet)) {
            throw "The installer license-page title must use 'Lisans sözleşmesi'."
          }
          if (-not (Select-String -Path "installer/MynAI.iss" -SimpleMatch 'UsePreviousAppDir=no' -Quiet)) {
            throw "The installer must not force the previous installation directory."
          }
          if (-not (Select-String -Path "installer/LICENSE-AGREEMENT.rtf" -SimpleMatch '0.1.6' -Quiet) -or
              (Select-String -Path "installer/LICENSE-AGREEMENT.rtf" -SimpleMatch '0.1.2' -Quiet)) {
            throw "License version must match release 0.1.6."
          }
          if (Select-String -Path "src/MynAI.Windows/SettingsWindow.xaml" -SimpleMatch 'KR / Kralus varsayılanına dön' -Quiet) {
            throw "The unwanted default-logo reset button must stay removed."
          }
          if (Select-String -Path "src/MynAI.Windows/SettingsWindow.xaml.cs" -Pattern 'ResetLogo_Click' -Quiet) {
            throw "The removed logo-reset button must not leave an unused handler."
          }
          if (-not (Select-String -Path "src/MynAI.Windows/MainWindow.xaml.cs" -Pattern '_trayIcon\.MouseClick' -Quiet)) {
            throw "The tray icon must restore the app on a left single click."
          }
          if (-not (Select-String -Path "src/MynAI.Windows/MainWindow.xaml.cs" -Pattern 'PlannedCountText.Visibility\s*=' -Quiet)) {
            throw "The planned task count must hide when zero and show when nonzero."
          }
          $mainCode = Get-Content -LiteralPath "src/MynAI.Windows/MainWindow.xaml.cs" -Raw -Encoding UTF8
          if (-not $mainCode.Contains('"Aktif •"')) { throw "Connected Agent status must display 'Aktif •'." }
          if (-not $mainCode.Contains('"Bağlantı yok •"')) { throw "Disconnected Agent status must remain explicit." }
          if (-not $mainCode.Contains('ReadLineAsync(responseCancellation.Token)') -or -not $mainCode.Contains('Agent 3 saniye içinde IPC yanıtı vermedi.')) { throw "Agent IPC response reads must time out instead of hanging the dashboard refresh." }
          if (-not $mainCode.Contains('_refreshTasksInProgress') -or -not $mainCode.Contains('"MYN-AGENT-001"')) { throw "Overlapping dashboard refreshes must be prevented and IPC failures logged." }
          $pairingClient = Get-Content -LiteralPath "src/MynAI.Windows/Auth/DesktopPairingClient.cs" -Raw -Encoding UTF8
          if (-not $pairingClient.Contains("HttpStatusCode.NotFound") -or -not $pairingClient.Contains("MYN-SERVER-404")) { throw "A missing live pairing endpoint must have a specific diagnosis." }
          $settingsText = Get-Content -LiteralPath "src/MynAI.Windows/SettingsWindow.xaml" -Raw -Encoding UTF8
          $settingsCode = Get-Content -LiteralPath "src/MynAI.Windows/SettingsWindow.xaml.cs" -Raw -Encoding UTF8
          $oauthService = Get-Content -LiteralPath "src/MynAI.Windows/Google/GoogleOAuthService.cs" -Raw -Encoding UTF8
          if (-not $settingsCode.Contains("Google Auth Platform") -or -not $settingsCode.Contains("DesktopPairingClientException")) { throw "OAuth and pairing deployment errors must have actionable diagnostics." }
          if (-not $oauthService.Contains("new LocalServerCodeReceiver(OAuthCallbackClosePage)") -or -not $oauthService.Contains("Google yanıtı alındı") -or -not $oauthService.Contains("bağlantı sonucunu kontrol ediyor")) { throw "The Google localhost callback page must be localized and must not display raw OAuth response data." }
          if (-not $pairingClient.Contains("currentSessionIdToken") -or -not $pairingClient.Contains('AuthenticationHeaderValue("Bearer", currentSessionIdToken)')) { throw "Normal desktop re-pairing must authenticate the existing Firebase session." }
          if (-not $pairingClient.Contains("GetFreshIdTokenAsync") -or -not $pairingClient.Contains("FirebaseAccountsLookupUrl") -or -not $pairingClient.Contains("resolvedUid, session.Uid")) { throw "Normal re-pairing must refresh the token and verify the UID before sending it." }
          if (-not $pairingClient.Contains("QrSignature") -or -not $settingsCode.Contains("pairing.QrSignature")) { throw "The Windows client must require and display the server-signed QR payload." }
          if (-not $settingsCode.Contains("allowAccountChange: true") -or -not $settingsCode.Contains("allowAccountChange: false") -or -not $settingsCode.Contains("GetFreshIdTokenAsync(existingSession")) { throw "Account switching must be explicit and normal pairing must refresh the current session." }
          if (-not $settingsCode.Contains("currentSessionIdToken,") -or -not $settingsCode.Contains("Kayıtlı oturum değişmedi; eşleştirme tamamlanmadı.")) { throw "Failed pairing must preserve and correctly describe the existing desktop session." }
          if (-not $settingsText.Contains("DesktopPairingQrPanel") -or -not $settingsText.Contains("DesktopPairingQrImage") -or -not (Select-String -Path "src/MynAI.Windows/MynAI.Windows.csproj" -Pattern '<PackageReference Include="QRCoder" Version="1.8.1"' -Quiet)) { throw "Windows must display the short-lived pairing QR as well as the manual code." }
          $qrPayloadCode = Get-Content -LiteralPath "src/MynAI.Windows/Auth/DesktopPairingQrPayload.cs" -Raw -Encoding UTF8
          if (-not $settingsCode.Contains("DesktopPairingQrPayload.Build(")) { throw "Windows QR generation must use the validated payload builder." }
          foreach ($requiredQrContract in @('private const string Marker = "MYNASSISTANT-PAIR";', 'private const string CodeAlphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";', 'normalizedCode.Length != 10', 'expiresAtUnix <= 0', 'signature.Length != 43')) {
            if (-not $qrPayloadCode.Contains($requiredQrContract)) { throw "Windows QR payload contract guard is missing: $requiredQrContract" }
          }
          if (-not $settingsCode.Contains('if (!hotkeyApplied)') -or -not $settingsCode.Contains('_settingsStore.Save(originalSettings)') -or -not $settingsCode.Contains('"MYN-SETTINGS-001"')) { throw "Settings save must validate hotkeys, attempt rollback, and record save failures." }
          if (-not $settingsCode.Contains('UpdateAccountDesktopBridgeStatus') -or -not $settingsCode.Contains('HTTP 404 görülürse Render')) { throw "Account status must explain how to begin pairing and recover from an undeployed server API." }
          $compilerCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $compiler = $compilerCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) {
            throw "Inno Setup compiler (ISCC.exe) was not found after installation."
          }
          & $compiler "installer/MynAI.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path "build/installer/MynAssistant-Setup.exe")) {
            throw "MynAssistant-Setup.exe was not created."
          }
          $installerInfo = Get-Item "build/installer/MynAssistant-Setup.exe"
          if ($installerInfo.Length -lt 50MB) {
            throw "Installer size is unexpectedly small; refusing to report success."
          }
          $installerSha256 = (Get-FileHash "build/installer/MynAssistant-Setup.exe" -Algorithm SHA256).Hash
          Write-Host "Installer path: $((Resolve-Path "build/installer/MynAssistant-Setup.exe").Path)"
          Write-Host "Installer size bytes: $($installerInfo.Length)"
          Write-Host "Installer SHA-256: $installerSha256"

          foreach ($signaturePath in @(
            "build/publish/MynAssistant.exe",
            "build/publish/MynAssistantDesktopBridge.exe",
            "build/agent-publish/MynAgent.exe",
            "build/installer/MynAssistant-Setup.exe"
          )) {
            $signature = Get-AuthenticodeSignature -FilePath $signaturePath
            $signer = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { "(unsigned)" }
            Write-Host "Authenticode: file=$signaturePath status=$($signature.Status) signer=$signer"
            if ($signature.Status -ne "Valid") {
              Write-Warning "$signaturePath is not Authenticode-verified. Windows Application Control may reject it; signing/trust must be validated on the target policy."
            }
          }

          $distributionDir = "build/distribution/MynAssistant-Windows-Installer"
          New-Item -ItemType Directory -Force -Path $distributionDir | Out-Null
          Copy-Item "build/installer/MynAssistant-Setup.exe" "$distributionDir/MynAssistant-Setup.exe" -Force
          @(
            "MynAssistant Windows Kurulum Paketi",
            "",
            "1. MynAssistant-Setup.exe dosyasını çalıştırın.",
            "2. Kurulum hedef klasörünü her kurulumda seçebilirsiniz. Aynı anda birden fazla bağımsız kurulum desteklenmez; mevcut klasör duruyorsa önce mevcut kurulumu kaldırın.",
            "3. MynAgent uygulama açılışında arka planda otomatik başlatılır; kurulum ekranında ayrı başlatma seçeneği yoktur.",
            "4. İlk telefon-PC bağlantısı için Windows Ayarlar → Hesap → Telefon-PC bağlantısı → Telefonla eşleştir seçeneğini açın. Windows'ta gösterilen 10 karakterli kodu Android MynAssistant → Ayarlar → Windows bilgisayarını eşleştir alanına yazıp onaylayın. Kod 5 dakika geçerlidir.",
            "5. Canlı sunucuda /api/v1/info yapılandırma kontrolü ve pairing/start HTTP 200 smoke testi geçti. Bu, başlangıç uç noktasının çalıştığını doğrular; telefon onayı sonrası Windows oturumunun tamamı gerçek Android ve Windows cihazlarında ayrıca test edilmelidir. Önceden kaydedilmiş geçerli oturum varsa köprü onu kullanır.",
            "6. Müşteriden client_secret.json veya ayrı logo dosyası istenmez.",
            "7. Google Kişiler bağlantısı isteğe bağlıdır. Google OAuth 403 access_denied verirse, OAuth projesi Google Auth Platform → Audience → Test users bölümünde bu Google hesabına yetki verilmelidir. Bu ayar Google Cloud Console'dadır ve telefon-PC eşleştirmesi için gerekmez.",
            "",
            "Not: Kuruluşunuz Windows Application Control politikasını kullanıyorsa imzasız dosyalar engellenebilir. Güvenlik politikasını kapatmayın; yayıncı imzası/Code Integrity günlükleri yöneticiniz tarafından doğrulanmalıdır."
          ) | Set-Content -Path "$distributionDir/README-Kurulum.txt" -Encoding UTF8
          $zipPath = "build/distribution/MynAssistant-Windows-Installer.zip"
          Compress-Archive -Path "$distributionDir/*" -DestinationPath $zipPath -Force
          $zipInfo = Get-Item $zipPath
          if ($zipInfo.Length -lt 50MB) {
            throw "Distribution ZIP is unexpectedly small; installer may be missing."
          }
          Write-Host "Distribution ZIP: $((Resolve-Path $zipPath).Path)"
          Write-Host "Distribution ZIP size bytes: $($zipInfo.Length)"
          $zipSha256 = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Distribution ZIP SHA-256: $zipSha256"
          "$zipSha256  MynAssistant-Windows-Installer.zip" | Set-Content -Path "$zipPath.sha256" -Encoding ascii
          if (-not (Test-Path "$zipPath.sha256") -or (Get-Item "$zipPath.sha256").Length -lt 80) {
            throw "Installer checksum sidecar was not generated."
          }

      - name: Upload Windows installer as Actions artifact
        id: upload_installer
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: MynAssistant-Windows-Installer
          path: |
            build/distribution/MynAssistant-Windows-Installer.zip
            build/distribution/MynAssistant-Windows-Installer.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish installer preview to GitHub Releases
        if: github.event_name != 'pull_request' && (steps.upload_installer.outcome == 'failure' || github.ref == 'refs/heads/fix/stage1-account-bound-pairing')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = "https://api.github.com/repos/$env:GH_REPOSITORY"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $tag = "mynassistant-installer-build-$env:GH_RUN_NUMBER"
          $releaseUrl = "$api/releases/tags/$tag"
          $release = $null

          try {
            $release = Invoke-RestMethod -Method Get -Uri $releaseUrl -Headers $headers
          } catch {
            $statusCode = 0
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }
            if ($statusCode -ne 404) {
              throw
            }
          }

          if ($null -eq $release) {
            $releaseBody = @{
              tag_name = $tag
              target_commitish = $env:GH_SHA
              name = "MynAssistant Windows Installer Preview (build $env:GH_RUN_NUMBER)"
              body = "Automated Stage 1 preview installer for commit $env:GH_SHA. The Windows .NET build, installer compilation, and validation completed in GitHub Actions. This prerelease is provided for direct testing without merging the feature branch into main; it is not a production release."
              draft = $false
              prerelease = $true
            } | ConvertTo-Json -Depth 5
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType "application/json" -Body $releaseBody
          } else {
            $assets = Invoke-RestMethod -Method Get -Uri "$api/releases/$($release.id)/assets?per_page=100" -Headers $headers
            foreach ($asset in $assets) {
              if ($asset.name -in @("MynAssistant-Windows-Installer.zip", "MynAssistant-Windows-Installer.zip.sha256")) {
                Invoke-RestMethod -Method Delete -Uri "$api/releases/assets/$($asset.id)" -Headers $headers | Out-Null
              }
            }
          }

          $installerPath = (Resolve-Path "build/distribution/MynAssistant-Windows-Installer.zip").Path
          $checksumPath = (Resolve-Path "build/distribution/MynAssistant-Windows-Installer.zip.sha256").Path
          $uploadItems = @(
            @{ Path = $installerPath; Name = "MynAssistant-Windows-Installer.zip"; ContentType = "application/zip" },
            @{ Path = $checksumPath; Name = "MynAssistant-Windows-Installer.zip.sha256"; ContentType = "text/plain" }
          )
          foreach ($item in $uploadItems) {
            $uploadUri = "https://uploads.github.com/repos/$env:GH_REPOSITORY/releases/$($release.id)/assets?name=$($item.Name)"
            $uploadedAsset = Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -ContentType $item.ContentType -InFile $item.Path
            if (-not $uploadedAsset.browser_download_url -or $uploadedAsset.state -ne "uploaded" -or $uploadedAsset.size -le 0) {
              throw "Release asset upload could not be verified: $($item.Name)"
            }
            Write-Host "Verified release asset: $($uploadedAsset.browser_download_url) size=$($uploadedAsset.size)"
          }

          Write-Host "Installer preview release published: $($release.html_url)"
