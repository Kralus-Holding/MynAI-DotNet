name: Build MynAssistant Windows Installer

concurrency:
  group: mynai-windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tools/MynAssistantDesktopBridge/**"
      - "installer/**"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "tools/MynAssistantDesktopBridge/**"
      - "installer/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          check-latest: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop bridge dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --timeout 60 --retries 2 -r tools/MynAssistantDesktopBridge/requirements.txt

      - name: Test desktop bridge command handling
        run: python -m unittest discover -s tools/MynAssistantDesktopBridge/tests -v

      - name: Build desktop bridge executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/bridge-dist, build/pyinstaller-work, build/pyinstaller-spec | Out-Null
          pyinstaller --noconfirm --clean --onefile --console --name MynAssistantDesktopBridge --distpath build/bridge-dist --workpath build/pyinstaller-work --specpath build/pyinstaller-spec --collect-all google_auth_oauthlib --collect-all google.auth --hidden-import win32crypt tools/MynAssistantDesktopBridge/agent.py
          if (-not (Test-Path "build/bridge-dist/MynAssistantDesktopBridge.exe")) {
            throw "Desktop Bridge EXE was not created."
          }

      - name: Verify WPF window icon loading remains non-fatal
        shell: pwsh
        run: |
          $windowXaml = @(
            "src/MynAI.Windows/MainWindow.xaml",
            "src/MynAI.Windows/SettingsWindow.xaml"
          )
          foreach ($path in $windowXaml) {
            if (Select-String -Path $path -Pattern 'Icon="Resources/myn.ico"' -Quiet) {
              throw "Do not load .ico via the WPF XAML ImageSource converter in $path."
            }
          }
          if (-not (Test-Path "src/MynAI.Windows/Resources/myn.jpg")) {
            throw "Fallback window image is missing."
          }
          if (-not (Select-String -Path "src/MynAI.Windows/MainWindow.xaml.cs" -Pattern 'image.CacheOption = BitmapCacheOption.OnLoad' -Quiet)) {
            throw "The main-window image must be decoded safely with OnLoad."
          }
          if (-not (Select-String -Path "src/MynAI.Windows/SettingsWindow.xaml.cs" -Pattern 'LoadWindowIconSafely' -Quiet)) {
            throw "The settings-window icon must use the safe loader."
          }

      - name: Restore and build .NET solution
        shell: pwsh
        run: |
          dotnet restore MynAI.slnx
          dotnet build MynAI.slnx --configuration Release --no-restore

      - name: Publish MynAssistant Windows application
        shell: pwsh
        run: |
          dotnet publish src/MynAI.Windows/MynAI.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false --output build/publish

          dotnet publish src/MynAI.Agent/MynAI.Agent.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -p:WindowsAppSDKSelfContained=true --output build/agent-publish

          Copy-Item "build/bridge-dist/MynAssistantDesktopBridge.exe" "build/publish/MynAssistantDesktopBridge.exe" -Force

          if (-not (Test-Path "build/publish/MynAssistant.exe")) {
            throw "MynAssistant.exe was not published."
          }
          if (-not (Test-Path "build/agent-publish/MynAgent.exe")) {
            throw "MynAgent.exe was not published; refusing to create an installer without the background Agent."
          }
          if (-not (Test-Path "build/publish/MynAssistantDesktopBridge.exe")) {
            throw "MynAssistantDesktopBridge.exe was not published."
          }

      - name: Prepare CI-only OAuth config
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/config | Out-Null
          $placeholder = @'
          {
            "installed": {
              "client_id": "ci-only.apps.googleusercontent.com",
              "project_id": "myncloud-24",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token",
              "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
              "client_secret": "CI_ONLY_NOT_A_REAL_SECRET",
              "redirect_uris": ["http://localhost"]
            }
          }
          '@
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path (Get-Location).Path "build/config/client_secret.json"), $placeholder, $utf8NoBom)

      - name: Prepare production OAuth config
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          MYNAI_GOOGLE_OAUTH_JSON: ${{ secrets.MYNAI_GOOGLE_OAUTH_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MYNAI_GOOGLE_OAUTH_JSON)) {
            throw "Missing repository Actions secret MYNAI_GOOGLE_OAUTH_JSON. Store the Google Desktop OAuth client JSON as this secret before building a distributable installer."
          }

          $parsed = $env:MYNAI_GOOGLE_OAUTH_JSON | ConvertFrom-Json
          if (-not $parsed.installed) {
            throw "MYNAI_GOOGLE_OAUTH_JSON must be a Google Desktop app OAuth client JSON with an installed root object."
          }

          New-Item -ItemType Directory -Force -Path build/config | Out-Null
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path (Get-Location).Path "build/config/client_secret.json"), $env:MYNAI_GOOGLE_OAUTH_JSON, $utf8NoBom)

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build/installer | Out-Null

          # Validate all installer assets before invoking Inno Setup.
          $licensePath = "installer/LICENSE-AGREEMENT.rtf"
          $iconPath = "src/MynAI.Windows/Resources/myn.ico"
          if (-not (Test-Path $licensePath)) { throw "License agreement file is missing: $licensePath" }
          if (-not (Test-Path $iconPath)) { throw "MynAssistant application icon is missing: $iconPath" }

          # Generate only the 55x58 top-right wizard logo from the same app ICO.
          # Avoids the old large custom wizard artwork that had scaling/rendering issues.
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::new((Resolve-Path $iconPath).Path)
          $sourceBitmap = $icon.ToBitmap()
          $wizardBitmap = [System.Drawing.Bitmap]::new(
            55, 58, [System.Drawing.Imaging.PixelFormat]::Format24bppRgb
          )
          $graphics = [System.Drawing.Graphics]::FromImage($wizardBitmap)
          $wizardSmallImage = "build/installer/MynAssistantWizardSmall.bmp"
          try {
            $graphics.Clear([System.Drawing.Color]::White)
            $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
            $scale = [Math]::Min(48.0 / $sourceBitmap.Width, 50.0 / $sourceBitmap.Height)
            $logoWidth = [Math]::Max(1, [int][Math]::Round($sourceBitmap.Width * $scale))
            $logoHeight = [Math]::Max(1, [int][Math]::Round($sourceBitmap.Height * $scale))
            $logoX = [int](($wizardBitmap.Width - $logoWidth) / 2)
            $logoY = [int](($wizardBitmap.Height - $logoHeight) / 2)
            $graphics.DrawImage(
              $sourceBitmap,
              [System.Drawing.Rectangle]::new($logoX, $logoY, $logoWidth, $logoHeight)
            )
            $wizardBitmap.Save($wizardSmallImage, [System.Drawing.Imaging.ImageFormat]::Bmp)
          }
          finally {
            $graphics.Dispose()
            $wizardBitmap.Dispose()
            $sourceBitmap.Dispose()
            $icon.Dispose()
          }
          if (-not (Test-Path $wizardSmallImage) -or (Get-Item $wizardSmallImage).Length -lt 100) {
            throw "MynAssistant wizard icon could not be generated."
          }

          $compilerCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $compiler = $compilerCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            throw "Inno Setup compiler (ISCC.exe) was not found after installation."
          }
          & $compiler "installer/MynAI.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path "build/installer/MynAssistant-Setup.exe")) {
            throw "MynAssistant-Setup.exe was not created."
          }

      - name: Upload Windows installer as Actions artifact
        id: upload_installer
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MynAssistant-Windows-Installer
          path: build/installer/MynAssistant-Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish installer to GitHub Releases if Actions storage is unavailable
        if: github.event_name != 'pull_request' && steps.upload_installer.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = "https://api.github.com/repos/$env:GH_REPOSITORY"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $tag = "mynassistant-installer-build-$env:GH_RUN_NUMBER"
          $releaseUrl = "$api/releases/tags/$tag"
          $release = $null

          try {
            $release = Invoke-RestMethod -Method Get -Uri $releaseUrl -Headers $headers
          } catch {
            $statusCode = 0
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }
            if ($statusCode -ne 404) {
              throw
            }
          }

          if ($null -eq $release) {
            $releaseBody = @{
              tag_name = $tag
              target_commitish = $env:GH_SHA
              name = "MynAssistant Windows Installer Preview (build $env:GH_RUN_NUMBER)"
              body = "Automated preview installer for commit $env:GH_SHA. The installer was built and validated by GitHub Actions. This prerelease is published as a fallback because Actions artifact storage was unavailable."
              draft = $false
              prerelease = $true
            } | ConvertTo-Json -Depth 5
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType "application/json" -Body $releaseBody
          } else {
            $assets = Invoke-RestMethod -Method Get -Uri "$api/releases/$($release.id)/assets?per_page=100" -Headers $headers
            foreach ($asset in $assets) {
              if ($asset.name -eq "MynAssistant-Setup.exe") {
                Invoke-RestMethod -Method Delete -Uri "$api/releases/assets/$($asset.id)" -Headers $headers | Out-Null
              }
            }
          }

          $installerPath = (Resolve-Path "build/installer/MynAssistant-Setup.exe").Path
          $uploadUri = "https://uploads.github.com/repos/$env:GH_REPOSITORY/releases/$($release.id)/assets?name=MynAssistant-Setup.exe"
          $uploadedAsset = Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -ContentType "application/octet-stream" -InFile $installerPath
          if (-not $uploadedAsset.browser_download_url -or $uploadedAsset.state -ne "uploaded") {
            throw "Release asset upload could not be verified."
          }

          Write-Host "Installer fallback release published: $($release.html_url)"
          Write-Host "Verified installer download URL: $($uploadedAsset.browser_download_url)"
